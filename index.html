    <style>
        :root {
            --color-primary: #a8c7fa;
            --color-accent: #4fc3f7;
            --color-bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--color-bg);
            font-family: var(--font-main);
            color: #ffffff;
            overflow: hidden;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .main-wrapper {
            position: relative;
            z-index: 2;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            perspective: 1000px;
        }

        .card-container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 40px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) rotateX(10deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0deg); }
        }

        #share-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }

        #share-btn:hover { background: var(--color-primary); }
        #share-btn:hover svg { fill: #000; }
        #share-btn svg { width: 20px; height: 20px; fill: var(--color-primary); }

        .logo {
            width: 180px;
            max-height: 80px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 8px rgba(168, 199, 250, 0.3));
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
            background: linear-gradient(to right, #fff, #a8c7fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .job-title {
            color: var(--color-primary);
            font-size: 13px; /* Légèrement réduit pour tenir sur une ligne si possible */
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.4;
        }

        .links-group {
            margin-bottom: 30px;
        }

        .action-link {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin-bottom: 10px;
            text-decoration: none;
            color: #eee;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-link:hover {
            background: rgba(168, 199, 250, 0.15);
            border-color: var(--color-primary);
            transform: scale(1.02);
        }

        .action-link svg {
            width: 20px;
            height: 20px;
            fill: var(--color-primary);
            margin-right: 15px;
        }

        .qr-section {
            background: #fff;
            padding: 15px;
            border-radius: 25px;
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        
        .qr-section:hover { transform: scale(1.05) rotate(1deg); }

        #qrcode-canvas {
            display: block;
            width: 160px !important;
            height: 160px !important;
        }

        .btn-add {
            width: 100%;
            padding: 20px;
            border-radius: 22px;
            border: none;
            font-weight: 800;
            font-size: 14px;
            background: var(--color-primary);
            color: #002d5e;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(168, 199, 250, 0.3);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="main-wrapper">
        <div class="card-container">
            <button id="share-btn" onclick="openShare()" aria-label="Partager">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            </button>

            <img src="https://cdn1.site-media.eu/images/576%2C2000x546%2B0%2B527/12103156/VRDTECT.png" alt="Logo VRD'TECT" class="logo">
            
            <h1>Cailleau Simon</h1>
            <div class="job-title">Responsable terrain Topographie - Récolement</div>

            <div class="links-group">
                <a href="tel:+33674509751" class="action-link">
                    <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    <span>Appeler le +33 6 74 50 97 51</span>
                </a>
                <a href="mailto:s.cailleau@vrdtect.com" class="action-link">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <span>s.cailleau@vrdtect.com</span>
                </a>
                <a href="https://www.vrdtect.com" target="_blank" class="action-link">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.95-7-7.93 0-.68.11-1.34.31-1.97l6.69 6.69v3.21zm-7.9-10.87c.18-.74.45-1.47.8-2.14l5.13 5.13-5.93-2.99zm4.25-6.84c.67-.35 1.4-.62 2.14-.8L7.84 9.1l-2.99-5.93zm6.84-4.25c.74.18 1.47.45 2.14.8l-5.13 5.13 2.99 5.93zm-3.21 7.9c.49 3.95 3.95 7 7.93 7 .68 0 1.34-.11 1.97-.31L12.07 12l-3.21 3.21z"/></svg>
                    <span>Consulter le site web</span>
                </a>
                <a href="https://maps.app.goo.gl/35uU7p6u8yA4uR7y8" target="_blank" class="action-link">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span>Siège Social : Beaucaire</span>
                </a>
            </div>

            <div class="qr-section">
                <canvas id="qrcode-canvas"></canvas>
            </div>

            <button id="vcard-btn" class="btn-add">
                Sauvegarder le contact
            </button>
        </div>
    </div>

    <script>
        // Initialisation Particules
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#a8c7fa" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.2, "random": false },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#a8c7fa", "opacity": 0.1, "width": 1 },
                "move": { "enable": true, "speed": 1.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 0.4 } } }
            },
            "retina_detect": true
        });

        const contact = {
            n: 'Cailleau;Simon;;;', // <-- NOUVEAU : Format Nom;Prénom;;;
            fn: 'Simon Cailleau',   // C'est le nom complet qui s'affichera
            title: 'Responsable terrain pole topographie - récolement',
            tel: '+33674509751',
            email: 's.cailleau@vrdtect.com',
            org: "VRD'TECT",
            adr: 'Immeuble Le Prisme - 13 BIS quai de la paix nord, 30300 BEAUCAIRE',
            url: window.location.href
        };

        // vCard mise à jour avec les champs N et FN
        const vCardData = `BEGIN:VCARD\nVERSION:3.0\nN:${contact.n}\nFN:${contact.fn}\nORG:${contact.org}\nTITLE:${contact.title}\nTEL;TYPE=CELL:${contact.tel}\nEMAIL:${contact.email}\nADR;TYPE=WORK:;;${contact.adr}\nURL:${contact.url}\nEND:VCARD`;

        function initQR() {
            const canvas = document.getElementById('qrcode-canvas');
            if (window.QRCode) {
                QRCode.toCanvas(canvas, vCardData, {
                    width: 320,
                    margin: 0,
                    color: { dark: '#0a0a0a', light: '#ffffff' }
                });
            } else { setTimeout(initQR, 100); }
        }

        async function openShare() {
            if (navigator.share) {
                try {
                    await navigator.share({ title: contact.fn, url: contact.url });
                } catch (e) {}
            } else {
                navigator.clipboard.writeText(contact.url);
                alert("Lien copié dans le presse-papier");
            }
        }

        document.getElementById('vcard-btn').onclick = () => {
            const blob = new Blob([vCardData], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Cailleau_Simon.vcf';
            a.click();
        };

        window.onload = initQR;
    </script>
</body>
